<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monotype</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>

    <main id="app">
        <!-- The independent caret -->
        <div id="caret" class="idle"></div>
        
        <div id="words-wrapper">
            <div id="words">
                <!-- Words and letters will be injected here by JavaScript -->
            </div>
        </div>
        
        <p class="hint">Click anywhere to focus, then start typing...</p>
    </main>

    <script type='module' src="src/main.js"></script>
</body>
</html>
